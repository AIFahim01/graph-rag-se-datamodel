<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRATHINK - Document Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-type {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-type button {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-type button.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }

        select {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .search-btn {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .search-btn:hover {
            background: #5a67d8;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .results {
            margin-top: 30px;
        }

        .result-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }

        .result-meta {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge-hvdc {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-syncon {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge-year {
            background: #e8f5e9;
            color: #388e3c;
        }

        .result-text {
            color: #555;
            line-height: 1.6;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ULTRATHINK Document Search</h1>
        <p class="subtitle">Search HVDC and SynCon Project Documentation</p>

        <!-- Statistics -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number">-</div>
                <div class="stat-label">Total Documents</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">-</div>
                <div class="stat-label">HVDC Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">-</div>
                <div class="stat-label">SynCon Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">-</div>
                <div class="stat-label">Years Covered</div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-type">
                <button class="active" onclick="setSearchType('semantic')">Semantic Search</button>
                <button onclick="setSearchType('metadata')">Metadata Search</button>
                <button onclick="setSearchType('qa')">Question & Answer</button>
            </div>

            <!-- Semantic Search -->
            <div id="semantic-search">
                <div class="search-box">
                    <input type="text" id="semantic-query" placeholder="Enter your search query (e.g., 'transformer protection systems')">
                    <button class="search-btn" onclick="performSemanticSearch()">Search</button>
                </div>
                <div class="filters">
                    <select id="semantic-tech-filter">
                        <option value="">All Technologies</option>
                        <option value="HVDC">HVDC Only</option>
                        <option value="SynCon">SynCon Only</option>
                    </select>
                    <select id="semantic-year-filter">
                        <option value="">All Years</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                    </select>
                </div>
            </div>

            <!-- Metadata Search -->
            <div id="metadata-search" style="display: none;">
                <div class="filters">
                    <select id="meta-tech">
                        <option value="">All Technologies</option>
                        <option value="HVDC">HVDC</option>
                        <option value="SynCon">SynCon</option>
                    </select>
                    <select id="meta-year">
                        <option value="">All Years</option>
                        <option value="2021">2021</option>
                        <option value="2022">2022</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                    </select>
                    <input type="text" id="meta-customer" placeholder="Customer name (optional)">
                    <button class="search-btn" onclick="performMetadataSearch()">Search</button>
                </div>
            </div>

            <!-- Q&A -->
            <div id="qa-search" style="display: none;">
                <div class="search-box">
                    <input type="text" id="qa-question" placeholder="Ask a question (e.g., 'Which projects have HVDC in 2025?')">
                    <button class="search-btn" onclick="performQASearch()">Ask</button>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div id="results" class="results"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';
        let currentSearchType = 'semantic';

        // Load statistics on page load
        async function loadStatistics() {
            try {
                const response = await fetch(`${API_URL}/statistics`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.data;
                    document.querySelector('.stats').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number">${stats.total_documents.toLocaleString()}</div>
                            <div class="stat-label">Total Documents</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${(stats.by_technology.HVDC || 0).toLocaleString()}</div>
                            <div class="stat-label">HVDC Documents</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${(stats.by_technology.SynCon || 0).toLocaleString()}</div>
                            <div class="stat-label">SynCon Documents</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${Object.keys(stats.by_year).length}</div>
                            <div class="stat-label">Years Covered</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        function setSearchType(type) {
            currentSearchType = type;

            // Update button states
            document.querySelectorAll('.search-type button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Show/hide search sections
            document.getElementById('semantic-search').style.display = type === 'semantic' ? 'block' : 'none';
            document.getElementById('metadata-search').style.display = type === 'metadata' ? 'block' : 'none';
            document.getElementById('qa-search').style.display = type === 'qa' ? 'block' : 'none';

            // Clear results
            document.getElementById('results').innerHTML = '';
        }

        async function performSemanticSearch() {
            const query = document.getElementById('semantic-query').value;
            if (!query) {
                alert('Please enter a search query');
                return;
            }

            const techFilter = document.getElementById('semantic-tech-filter').value;
            const yearFilter = document.getElementById('semantic-year-filter').value;

            showLoading();

            try {
                const response = await fetch(`${API_URL}/search/vector`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        top_k: 10,
                        technology_filter: techFilter || undefined,
                        year_filter: yearFilter || undefined
                    })
                });

                const data = await response.json();
                displaySemanticResults(data);
            } catch (error) {
                showError('Error performing search: ' + error.message);
            }
        }

        async function performMetadataSearch() {
            const technology = document.getElementById('meta-tech').value;
            const year = document.getElementById('meta-year').value;
            const customer = document.getElementById('meta-customer').value;

            showLoading();

            try {
                const response = await fetch(`${API_URL}/search/metadata`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        technology: technology || undefined,
                        year: year || undefined,
                        customer: customer || undefined,
                        limit: 100
                    })
                });

                const data = await response.json();
                displayMetadataResults(data);
            } catch (error) {
                showError('Error performing search: ' + error.message);
            }
        }

        async function performQASearch() {
            const question = document.getElementById('qa-question').value;
            if (!question) {
                alert('Please enter a question');
                return;
            }

            showLoading();

            try {
                const response = await fetch(`${API_URL}/answer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();
                displayQAResults(data);
            } catch (error) {
                showError('Error answering question: ' + error.message);
            }
        }

        function displaySemanticResults(data) {
            const resultsDiv = document.getElementById('results');

            if (!data.success) {
                showError(data.error);
                return;
            }

            if (data.results.length === 0) {
                resultsDiv.innerHTML = '<p>No results found.</p>';
                return;
            }

            let html = `<h3>Found ${data.total_results} relevant documents:</h3>`;

            data.results.forEach(result => {
                const techClass = result.technology === 'HVDC' ? 'badge-hvdc' : 'badge-syncon';
                html += `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-title">${result.project_id} - ${result.project_name || 'Project'}</div>
                            <div>
                                <span class="badge ${techClass}">${result.technology}</span>
                                <span class="badge badge-year">${result.year}</span>
                            </div>
                        </div>
                        <div class="result-meta">
                            <span>📄 Page ${result.page}</span>
                            <span>🏢 ${result.customer}</span>
                            <span>📊 Score: ${result.score ? result.score.toFixed(3) : 'N/A'}</span>
                        </div>
                        <div class="result-text">${result.text.substring(0, 300)}...</div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function displayMetadataResults(data) {
            const resultsDiv = document.getElementById('results');

            if (!data.success) {
                showError(data.error);
                return;
            }

            if (data.total_projects === 0) {
                resultsDiv.innerHTML = '<p>No projects found matching your criteria.</p>';
                return;
            }

            let html = `<h3>Found ${data.total_projects} projects (${data.total_chunks} documents):</h3>`;

            Object.values(data.projects).forEach(project => {
                const techClass = project.technology === 'HVDC' ? 'badge-hvdc' : 'badge-syncon';
                html += `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-title">${project.project_id} - ${project.project_name || 'Project'}</div>
                            <div>
                                <span class="badge ${techClass}">${project.technology}</span>
                                <span class="badge badge-year">${project.year}</span>
                            </div>
                        </div>
                        <div class="result-meta">
                            <span>🏢 ${project.customer}</span>
                            <span>📄 ${project.pages.length} pages</span>
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function displayQAResults(data) {
            const resultsDiv = document.getElementById('results');

            if (!data.success) {
                showError(data.error);
                return;
            }

            const answer = data.answer;
            let html = `<h3>Question: ${answer.question}</h3>`;

            if (answer.answer_type === 'count') {
                html += `
                    <div class="result-card">
                        <div class="result-title">Answer:</div>
                        <div class="result-text">
                            Found <strong>${answer.count}</strong> documents across <strong>${answer.unique_projects}</strong> unique projects.
                        </div>
                    </div>
                `;
            } else if (answer.answer_type === 'list') {
                html += `<p>Found ${answer.total_projects} projects:</p>`;
                answer.projects.forEach(project => {
                    const techClass = project.technology === 'HVDC' ? 'badge-hvdc' : 'badge-syncon';
                    html += `
                        <div class="result-card">
                            <div class="result-header">
                                <div class="result-title">${project.project_id} - ${project.project_name || 'Project'}</div>
                                <div>
                                    <span class="badge ${techClass}">${project.technology}</span>
                                    <span class="badge badge-year">${project.year}</span>
                                </div>
                            </div>
                            <div class="result-meta">
                                <span>🏢 ${project.customer}</span>
                                <span>📄 ${project.pages.length} pages</span>
                            </div>
                        </div>
                    `;
                });
            } else if (answer.answer_type === 'semantic_search') {
                html += '<p>Most relevant documents:</p>';
                answer.results.forEach(result => {
                    const techClass = result.technology === 'HVDC' ? 'badge-hvdc' : 'badge-syncon';
                    html += `
                        <div class="result-card">
                            <div class="result-header">
                                <div class="result-title">${result.project_id} - Page ${result.page}</div>
                                <div>
                                    <span class="badge ${techClass}">${result.technology}</span>
                                    <span class="badge badge-year">${result.year}</span>
                                </div>
                            </div>
                            <div class="result-meta">
                                <span>🏢 ${result.customer}</span>
                                <span>📊 Score: ${result.score ? result.score.toFixed(3) : 'N/A'}</span>
                            </div>
                            <div class="result-text">${result.text.substring(0, 300)}...</div>
                        </div>
                    `;
                });
            }

            resultsDiv.innerHTML = html;
        }

        function showLoading() {
            document.getElementById('results').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching...</p>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('results').innerHTML = `
                <div class="error">Error: ${message}</div>
            `;
        }

        // Load statistics on page load
        loadStatistics();
    </script>
</body>
</html>
