[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-graphrag"
version = "0.1.0"
description = "Domain-specific document intelligence using contrastive learning and GraphRAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "embeddings",
    "contrastive-learning",
    "knowledge-graph",
    "graphrag",
    "document-intelligence",
    "local-llm",
    "sentence-transformers"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
"Homepage" = "https://github.com/your-org/pdf-to-graphrag"
"Bug Tracker" = "https://github.com/your-org/pdf-to-graphrag/issues"
"Documentation" = "https://github.com/your-org/pdf-to-graphrag/blob/main/docs/architecture.md"

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
