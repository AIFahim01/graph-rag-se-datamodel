# Docker Compose for GraphRAG Microservices Architecture
#
# This is the production-ready microservices setup.
#
# Usage:
#   docker-compose -f docker-compose.microservices.yml up -d
#   docker-compose -f docker-compose.microservices.yml logs -f
#   docker-compose -f docker-compose.microservices.yml down

version: '3.8'

services:
  # ============================================================
  # MESSAGE BROKER
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: graphrag-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER_DEV:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS_DEV:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network
    restart: unless-stopped

  # ============================================================
  # PROGRESS TRACKING DATABASE
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: graphrag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: graphrag_progress
      POSTGRES_USER: graphrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphrag_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphrag"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network
    restart: unless-stopped

  # ============================================================
  # VECTOR STORE
  # ============================================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: graphrag-chromadb
    ports:
      - "8002:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      ALLOW_RESET: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network
    restart: unless-stopped

  # ============================================================
  # KNOWLEDGE GRAPH DATABASE
  # ============================================================
  neo4j:
    image: neo4j:5.12-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: none
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphrag-network
    restart: unless-stopped

  # ============================================================
  # MONITORING
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: graphrag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - graphrag-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: graphrag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - graphrag-network
    restart: unless-stopped

  # ============================================================
  # NOTE: Worker services would be added here
  # ============================================================
  # Uncomment and configure when Dockerfiles are ready:
  #
  # orchestrator:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.orchestrator
  #   container_name: graphrag-orchestrator
  #   environment:
  #     - RABBITMQ_HOST=rabbitmq
  #     - POSTGRES_HOST=postgres
  #   depends_on:
  #     - rabbitmq
  #     - postgres
  #   networks:
  #     - graphrag-network
  #   restart: unless-stopped

networks:
  graphrag-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
  chromadb_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
